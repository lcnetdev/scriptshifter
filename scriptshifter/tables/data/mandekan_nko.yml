---
general:
  name: Mandekan (N'Ko)
  description: Conversion mapping for Mandekan languages in the N'ko script (script to roman only).
  version: 1.0.0
  date: 2026-10-05
  parents:
    - _ignore_base
    - nko_generic
  case_sensitive: false

# COMMON SPECIAL AND COMBINING CHARACTERS:
# Apostophe \u0027
# Latin small letter eng \u014B
# latin small letter b with hook \u0253
# Latin small letter d with hook \u0257
# latin small letter schwa \u0259
# Latin small letter n with left hook \u0272
# combining grave \u0300
# combining acute \u0301
# combining tilde \u0303
# combining macron \u0304
# combining breve \u0306
# combining diaeresis \u0308
# combining caron \u030C
# combining dot below \u0323
# combining breve below \u032E
# combining lowline \u0332
# combining double lowline \u0333
# modifier letter prime (soft sign - spacing) \u02B9
# modifier letter turned comma (ayn - spacing) \u02BB 
# modifier letter apostrophe (alif - spacing) \u02BC
# Arabic semicolon \u061B
# Arabic question mark \u061F
# zero width joiner \u200C

